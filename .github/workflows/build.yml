name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          xcodebuild build \
            -project MouseCustomize.xcodeproj \
            -target MouseCustomize \
            -configuration Release \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= \
            SYMROOT="$PWD/build"

      - name: Zip app
        run: ditto -c -k --keepParent build/Release/MouseCustomize.app MouseCustomize.zip

      - uses: actions/upload-artifact@v4
        with:
          name: MouseCustomize
          path: MouseCustomize.zip
