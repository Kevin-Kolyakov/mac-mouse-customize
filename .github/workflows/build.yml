name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          xcodebuild build \
            -project MouseCustomize.xcodeproj \
            -target MouseCustomize \
            -configuration Release \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= \
            SYMROOT="$PWD/build"

      - name: Zip app
        run: ditto -c -k --keepParent build/Release/MouseCustomize.app MouseCustomize.zip

      - uses: actions/upload-artifact@v4
        with:
          name: MouseCustomize
          path: MouseCustomize.zip

      - uses: actions/setup-node@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Publish to npm
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: npm
        run: |
          cp ../MouseCustomize.zip .
          npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
